# Builds Print Lab Slicer (slicer/engine against the Bambu Studio tag in slicer/upstream.lock plus our
# patch queue) for each desktop platform and uploads printlab-slicer-<platform>: the binary, the
# resources it reads (profiles from the same tag), LICENSE and engine.json. The dependency superbuild
# takes hours the first time, so it is cached by build-deps.sh's key (tag, deps/ tree, platform).
# release.yml requires every native platform to pass before building desktop installers.
name: Slicer build

on:
  push:
    # Tags build this workflow through release.yml; do not duplicate its native builds.
    branches: ["**"]
    paths: ["slicer/**", "!slicer/**/*.md", ".github/workflows/slicer-build.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: Engine platform to build
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - darwin-arm64
          - win32-x64
  workflow_call:
    inputs:
      require-native:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The protocol layer and the app's conformance tests against it run in ci.yml (slicer-protocol) on
  # every pull request, so changes to the app-side client are checked too.
  engine:
    strategy:
      fail-fast: false
      matrix:
        # Pushes and reusable calls keep the full matrix; manual retries can select one platform.
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux-x64","darwin-arm64","win32-x64"]') }}
    # Ubuntu 22.04 is the oldest glibc we ship for.
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-22.04","darwin-arm64":"macos-14","win32-x64":"windows-2022"}')[matrix.platform] }}
    # Development builds can report portability failures; releases require every platform.
    continue-on-error: ${{ !inputs.require-native && matrix.platform != 'linux-x64' }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      PRINTLAB_SLICER_BUILD_DIR: ${{ github.workspace }}/slicer/.build
      CMAKE_GENERATOR: ${{ matrix.platform == 'win32-x64' && 'Visual Studio 17 2022' || 'Unix Makefiles' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build tools
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y build-essential cmake git m4 pkg-config libdbus-1-dev libgl1-mesa-dev autoconf automake libtool texinfo ;;
            macOS) brew install cmake m4 autoconf automake libtool texinfo ;;
            Windows) choco install pkgconfiglite --version=0.28 --yes --no-progress ;;
          esac
      - name: Dependency target discovery and build option tests
        run: bash slicer/tests/build.test.sh
      - name: Bambu Studio at the pin, with our patch queue
        run: slicer/scripts/upstream.sh fetch
      - name: Headless Windows runtime copy regression
        run: python slicer/tests/windows-dll-copy.test.py
      - name: Dependency cache key
        id: key
        run: echo "key=$(slicer/scripts/build-deps.sh --print-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: slicer/.build/deps/usr/local
          key: ${{ steps.key.outputs.key }}
      - name: Mark cached dependencies as built
        run: |
          if [ -d slicer/.build/deps/usr/local/lib ]; then echo "${{ steps.key.outputs.key }}" > slicer/.build/deps/.stamp; fi
      - name: Build the engine
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # OpenSSL calls plain perl; Git Bash's trimmed Perl lacks required core modules.
            # Use the native Strawberry Perl supplied by the windows-2022 runner image.
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -MIPC::Cmd -MLocale::Maketext::Simple -e 'die "Native Windows Perl is required\n" unless $^O eq "MSWin32";'
            # Upstream honours PKG_CONFIG_EXECUTABLE. Select the native Chocolatey executable
            # explicitly so Strawberry's extensionless Perl wrapper cannot shadow it.
            pkg_config="$(bash slicer/scripts/windows-pkg-config.sh "$(command -v pkg-config.exe)")"
            export PKG_CONFIG_EXECUTABLE="$(cygpath -m "$pkg_config")"
          fi
          slicer/scripts/upstream.sh build -j 4
      - name: Check completed dependencies
        id: completed-dependencies
        if: ${{ always() && steps.key.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        env:
          EXPECTED_KEY: ${{ steps.key.outputs.key }}
        run: |
          if [ -d slicer/.build/deps/usr/local/lib ] &&
             [ -f slicer/.build/deps/.stamp ] &&
             [ "$(cat slicer/.build/deps/.stamp)" = "$EXPECTED_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.completed-dependencies.outputs.ready == 'true' }}
        with:
          path: slicer/.build/deps/usr/local
          key: ${{ steps.key.outputs.key }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - name: Engine tests, conformance and golden slices
        run: |
          (cd app && bun install)
          slicer/scripts/upstream.sh test
      - uses: actions/upload-artifact@v4
        with:
          name: printlab-slicer-${{ matrix.platform }}
          path: slicer/dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
