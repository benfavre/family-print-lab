name: Desktop release

# Push a tag like v2.2.0 (matching desktop/package.json) to build the installers and publish them as a
# GitHub Release. The desktop app updates itself from these releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Print Lab Slicer for each platform (slicer-build.yml). Its result does not gate the release: the
  # desktop build below bundles whatever engine artifacts exist and the app falls back to an installed
  # Bambu Studio otherwise.
  engine:
    uses: ./.github/workflows/slicer-build.yml

  build:
    needs: engine
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Print Lab Slicer for this platform
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: printlab-slicer-${{ matrix.platform }}
          path: slicer/dist/${{ matrix.platform }}
      # Artifacts do not keep the executable bit.
      - shell: bash
        run: chmod +x slicer/dist/*/printlab-slicer 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - name: Tag matches the desktop version
        shell: bash
        run: test "v$(node -p "require('./desktop/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Desktop bundle tests
        run: node --test desktop/scripts/prepare-server.test.mjs
      - run: bun install
        working-directory: app
      - run: bun install
        working-directory: desktop
      - run: bun run release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now: no Apple/Windows code-signing certificates yet.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
